# ==============================================================================
# compatibility.bom.yaml
# cultivating-ml-agent ML Profile 兼容性物料清单 (Compatibility BOM)
# ==============================================================================
# 计划 G0 硬约束：全部外部 Profile / 依赖必须带 tag / commit 与锁定日期；
# 无锁定项不得进入编译或执行路径。
# SHA 值为 2026-10-09 锁定时给定的精确值，修改必须走新的 BOM 版本。
# ==============================================================================

version: 1.0.0
bom: cultivating-ml-agent-profile-compatibility
locked_at: 2026-10-09
policy: "每项外部依赖必须附 role 与 locked_at；SHA 一经锁定不可变。"

external_profiles:

  - id: prism-ontology
    ref: 9d93a99
    role: "上游参考本体与样板来源（outlet-insight profile 骨架、prism-core 父类语义）"
    locked_at: 2026-10-09

  - id: agent-nurture-framework
    ref: 33f444b
    role: "经验/能力/证据/策略记录 JSON Schema 的权威来源（ADR-002 投影边界的数据面）"
    schemas:
      - capability-record
      - experience-record
      - evidence-envelope
      - policy-record
    locked_at: 2026-10-09

  - id: skill-tester
    ref: c5022b8
    role: "技能资产验收工具链（ML Profile 产出的经验条目入库前校验）"
    locked_at: 2026-10-09

  - id: VisitIR
    ref: cd2ce48
    role: "家法样板：纯函数、零求解器依赖、只能证伪不能证真的快筛分层——本 Profile 概念语义的对齐参照"
    locked_at: 2026-10-09

  - id: VisitModel
    ref: 0dd8bbb
    role: "VisitIR 配套模型层参照（模型工件 ModelArtifact 的生命周期先例）"
    locked_at: 2026-10-09

  - id: Territory-IR
    ref: 41fc2bd
    role: "领域 IR 先例参照（局部命名空间与治理晋升路径的对照样本）"
    locked_at: 2026-10-09

  - id: cultivating-ml-agent
    branch: main
    ref: 6e58f52
    role: "本仓库基线（含 P0 修复：splits.py 四策略 CV、validate.py、oof.py）；ML Profile 字段引用的框架锚点"
    locked_at: 2026-10-09

toolchain:

  - id: python
    spec: "3.10 / 3.12"
    role: "CI 运行时矩阵"
    locked_at: 2026-10-09

  - id: jsonschema
    spec: 4.x
    role: "ANF schema 校验（evidence-envelope / experience-record 导出适配器验证）"
    locked_at: 2026-10-09

  - id: scikit-learn
    spec: ci-subset
    role: "splits.py 四策略切分（StratifiedKFold / KFold / GroupKFold）依赖"
    locked_at: 2026-10-09

  - id: numpy
    spec: ci-subset
    role: "OOF 帧与数值管线基础依赖"
    locked_at: 2026-10-09

  - id: pandas
    spec: ci-subset
    role: "OOF 帧构建（oof.py build_oof_frame）依赖"
    locked_at: 2026-10-09

  - id: pyyaml
    spec: ci-subset
    role: "本 BOM 与 ML Profile YAML 工件解析依赖"
    locked_at: 2026-10-09

# ==============================================================================
# 本地领域路径依赖（untagged-local）
# ==============================================================================
# P4 跨域（SPEC-006）裁决：BOM 应记本地领域依赖——ADAPTER-002 的求解器往返
# 真验（tests/test_adapters_pjp.py::TestRealSolverRoundTrip）读取本机领域仓
# checkout；无 tag/commit 可锁（本地工作区，随开发漂移），故以 untagged-local
# 如实标注而非伪装成锁定项。纪律：仅守卫测试路径使用（VISITMODEL_PATH 环境变量
# 守卫，CI 无此路径自动 skip）；不入编译/执行路径；适配器仍以 JSON 信封为界、
# 零求解器 import。引擎/领域仓发布可锁 ref 时，必须走新 BOM 版本转正。
# ==============================================================================

local_domain_paths:

  - id: VisitModel
    path: /Users/ghb/VisitModel
    tag_status: untagged-local
    role: "sp_solve_ip 求解器往返真验目标（4 店×4 日 fixture，SPEC-006 §7 测试分层）"
    guard: "VISITMODEL_PATH 环境变量，先判非空再判存在"
    locked_at: 2026-10-09

  - id: VisitIR
    path: /Users/ghb/VisitIR
    tag_status: untagged-local
    role: "VisitModel 顶层 import 依赖（visit_ir/contract）；0 基 sigma 语义的权威出处（visit_semantic_api）"
    guard: "与 VisitModel 同级派生，存在才加入 sys.path"
    locked_at: 2026-10-09

  - id: OptiCore
    path: /Users/ghb/OptiCore
    tag_status: untagged-local
    role: "VisitModel tsp 模块顶层 import 依赖（opticore.heuristics）；仅使 visitmodel 可导入"
    guard: "与 VisitModel 同级派生，存在才加入 sys.path"
    locked_at: 2026-10-09

