name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Deliberately NOT installing framework/requirements.txt in full:
      # it pulls mlflow, lightgbm, xgboost, catboost and the kaggle CLI,
      # none of which the test suite needs (mlflow-dependent tests skip
      # themselves). Only the test-required subset is installed to keep
      # CI fast and dependency-light.
      - name: Install test dependencies
        run: python -m pip install -q numpy pandas pyyaml scikit-learn pytest jsonschema

      - name: Run tests
        run: python -m pytest tests/ -q
