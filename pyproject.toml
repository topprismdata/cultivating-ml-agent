[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "cultivating-ml-agent"
version = "0.8.4"
description = "Knowledge crystallization framework for training ML agents from novice to competition Top 10%"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "TopPrism Data"},
]
keywords = ["machine-learning", "kaggle", "autogluon", "automl", "knowledge-management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/topprismdata/cultivating-ml-agent"
Documentation = "https://github.com/topprismdata/cultivating-ml-agent/blob/main/docs/cultivating-ml-agent-expert.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["framework*", "skills*", "templates*"]
